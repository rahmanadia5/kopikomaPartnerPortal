<rect width="920" height="1330" fill="#fff"/><rect x="275.0" y="21.0" width="250" height="58" rx="8" fill="#FCE9D2" stroke="#C27A2C" stroke-width="1.6"/><text x="283.0" y="33.0" font-size="9.5" font-weight="700" fill="#C27A2C">CANDIDATE</text><text x="400" y="56.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Registers on Partner Portal</text><rect x="15.0" y="21.0" width="160" height="58" rx="8" fill="#E4F1E6" stroke="#3F8A50" stroke-width="1.6"/><text x="23.0" y="33.0" font-size="9.5" font-weight="700" fill="#3F8A50">SALES</text><text x="95" y="48.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Adds lead</text><text x="95" y="64.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">(offline channel)</text><polygon points="400,117.0 515.0,160 400,203.0 285.0,160" fill="#E6EEF8" stroke="#4A72A8" stroke-width="1.6"/><text x="400" y="144.5" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">1. New lead:</text><text x="400" y="160.0" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">auto-assign</text><text x="400" y="175.5" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">possible?</text><text x="585" y="213.25" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">Auto-assign if same region, not a duplicate,</text><text x="585" y="226.75" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">and the regional sales is below lead cap</text><rect x="675.0" y="131.0" width="190" height="58" rx="8" fill="#F7E1E1" stroke="#B04848" stroke-width="1.6"/><text x="683.0" y="143.0" font-size="9.5" font-weight="700" fill="#B04848">MANAGER</text><text x="770" y="158.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Assign sales</text><text x="770" y="174.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">manually</text><rect x="255.0" y="246.0" width="290" height="58" rx="8" fill="#E4F1E6" stroke="#3F8A50" stroke-width="1.6"/><text x="263.0" y="258.0" font-size="9.5" font-weight="700" fill="#3F8A50">SALES</text><text x="400" y="273.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">2. Business presentation</text><text x="400" y="289.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">+ send prospectus</text><rect x="255.0" y="346.0" width="290" height="58" rx="8" fill="#E4F1E6" stroke="#3F8A50" stroke-width="1.6"/><text x="263.0" y="358.0" font-size="9.5" font-weight="700" fill="#3F8A50">SALES</text><text x="400" y="381.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">3. Location survey</text><text x="770" y="368.25" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">AI location score below 60:</text><text x="770" y="381.75" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">discuss with Manager first</text><polygon points="400,440.0 515.0,480 400,520.0 285.0,480" fill="#E4F1E6" stroke="#3F8A50" stroke-width="1.6"/><text x="400" y="472.25" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Location</text><text x="400" y="487.75" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">feasible?</text><rect x="240.0" y="561.0" width="320" height="58" rx="8" fill="#EFE6F6" stroke="#7E57A8" stroke-width="1.6"/><text x="248.0" y="573.0" font-size="9.5" font-weight="700" fill="#7E57A8">REVIEWER</text><text x="400" y="588.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">4. Eligibility assessment</text><text x="400" y="604.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">(interview, background, finance, KYC)</text><polygon points="400,657.0 515.0,695 400,733.0 285.0,695" fill="#EFE6F6" stroke="#7E57A8" stroke-width="1.6"/><text x="400" y="695.0" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Eligible?</text><rect x="255.0" y="776.0" width="290" height="58" rx="8" fill="#E4F1E6" stroke="#3F8A50" stroke-width="1.6"/><text x="263.0" y="788.0" font-size="9.5" font-weight="700" fill="#3F8A50">SALES</text><text x="400" y="803.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">5. Send quotation version N</text><text x="400" y="819.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">(email + Partner Portal link)</text><rect x="240.0" y="881.0" width="320" height="58" rx="8" fill="#FCE9D2" stroke="#C27A2C" stroke-width="1.6"/><text x="248.0" y="893.0" font-size="9.5" font-weight="700" fill="#C27A2C">CANDIDATE</text><text x="400" y="908.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">6. Negotiation: candidate responds</text><text x="400" y="924.0" font-size="13" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">(in portal, or recorded by Sales)</text><polygon points="400,980.0 515.0,1020 400,1060.0 285.0,1020" fill="#FCE9D2" stroke="#C27A2C" stroke-width="1.6"/><text x="400" y="1020.0" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">Response?</text><polygon points="400,1093.0 515.0,1135 400,1177.0 285.0,1135" fill="#F7E1E1" stroke="#B04848" stroke-width="1.6"/><text x="400" y="1127.25" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">7. Final</text><text x="400" y="1142.75" font-size="12.5" font-weight="600" fill="#222" text-anchor="middle" dominant-baseline="middle">approval?</text><rect x="300.0" y="1220.0" width="200" height="40" rx="20.0" fill="#2F7D46" stroke="#2F7D46" /><text x="400" y="1240.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Approved (2 of 2)</text><rect x="675.0" y="1215.0" width="190" height="50" rx="25.0" fill="#2F7D46" stroke="#2F7D46" stroke-dasharray="5 4" fill-opacity="0"/><text x="770" y="1232.25" font-size="12.5" font-weight="700" fill="#2F7D46" text-anchor="middle" dominant-baseline="middle">Agreement via Privy</text><text x="770" y="1247.75" font-size="12.5" font-weight="700" fill="#2F7D46" text-anchor="middle" dominant-baseline="middle">(roadmap)</text><rect x="685.0" y="460.0" width="170" height="40" rx="20.0" fill="#B04848" stroke="#B04848" /><text x="770" y="480.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Rejected</text><rect x="685.0" y="675.0" width="170" height="40" rx="20.0" fill="#B04848" stroke="#B04848" /><text x="770" y="695.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Rejected</text><rect x="685.0" y="1115.0" width="170" height="40" rx="20.0" fill="#B04848" stroke="#B04848" /><text x="770" y="1135.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Rejected</text><rect x="685.0" y="1000.0" width="170" height="40" rx="20.0" fill="#777" stroke="#777" /><text x="770" y="1020.0" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">Withdrawn</text><path d="M400,79 L400,117" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M515,160 L675,160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="525" y="152" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">No</text><path d="M400,203 L400,246" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="408" y="240" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Yes</text><path d="M770,189 L770,275 L545,275" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M95,79 L95,275 L255,275" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="103" y="235" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Owned by that sales</text><path d="M400,304 L400,346" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M400,404 L400,440" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M515,480 L685,480" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="525" y="472" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">No</text><path d="M400,520 L400,561" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="408" y="540" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Yes</text><path d="M400,619 L400,657" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M515,695 L685,695" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="525" y="687" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">No</text><path d="M400,733 L400,776" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="408" y="753" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Yes</text><path d="M400,834 L400,881" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M400,939 L400,980" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><path d="M515,1020 L685,1020" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="525" y="1012" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Withdraw</text><path d="M400,1060 L400,1093" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="408" y="1084" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Agree (1 of 2)</text><path d="M285,1020 L180,1020 L180,805 L255,805" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="188" y="1012" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Request changes</text><text x="250" y="851.0" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">(revision, with Manager input)</text><path d="M340,1040 L340,1082 L40,1082 L40,375 L255,375" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="48" y="1074" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Change location</text><text x="150" y="421.0" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle" dominant-baseline="middle">(new address, then revised quotation)</text><path d="M515,1135 L685,1135" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="525" y="1127" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Reject</text><path d="M400,1177 L400,1220" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="408" y="1197" font-size="11.5" font-weight="700" fill="#444" text-anchor="start">Approve (2 of 2)</text><path d="M500,1240 L675,1240" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="1278" width="14" height="14" rx="3" fill="#FCE9D2" stroke="#C27A2C"/><text x="50" y="1290" font-size="12" fill="#333">Candidate</text><rect x="140" y="1278" width="14" height="14" rx="3" fill="#E6EEF8" stroke="#4A72A8"/><text x="160" y="1290" font-size="12" fill="#333">System</text><rect x="250" y="1278" width="14" height="14" rx="3" fill="#E4F1E6" stroke="#3F8A50"/><text x="270" y="1290" font-size="12" fill="#333">Sales</text><rect x="360" y="1278" width="14" height="14" rx="3" fill="#EFE6F6" stroke="#7E57A8"/><text x="380" y="1290" font-size="12" fill="#333">Reviewer</text><rect x="470" y="1278" width="14" height="14" rx="3" fill="#F7E1E1" stroke="#B04848"/><text x="490" y="1290" font-size="12" fill="#333">Manager</text><text x="460.0" y="1314.0" font-size="11.5" font-weight="400" fill="#444" text-anchor="middle" dominant-baseline="middle">Every stage has a deadline. Overdue stages trigger automatic reminders to the PIC and the Manager (dashboard and email).</text></svg>